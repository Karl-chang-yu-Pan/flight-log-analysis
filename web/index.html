<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Flight Log</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="upload-page">
    <header class="app-nav">
      <a class="app-nav-brand" href="/upload">Flight Log Review</a>
      <nav class="app-nav-actions" aria-label="Upload navigation">
        <a class="active" href="/upload" aria-current="page">Upload</a>
        <a href="/browse">Browse</a>
      </nav>
    </header>

    <main class="upload-workspace">
      <div class="upload-heading">
        <div>
          <h1>Upload Flight Log</h1>
          <p>Choose a ULog and optional analysis inputs.</p>
        </div>
        <span id="uploadStatus" class="status-text">Idle</span>
      </div>

      <form class="upload-panel" id="uploadForm" enctype="multipart/form-data">
        <div class="upload-grid">
          <label>
            ULog file
            <input id="logFile" name="log_file" type="file" accept=".ulg">
          </label>
          <label>
            Mission file
            <input id="missionFile" name="mission_file" type="file" accept=".plan,.waypoints,.txt">
          </label>
          <label>
            Parameters XML
            <input id="parametersXmlFile" name="parameters_xml_file" type="file" accept=".xml">
          </label>
          <label>
            PX4 source
            <input id="sourcePath" name="source_path" type="text" placeholder="optional PX4 checkout">
          </label>
        </div>

        <details class="advanced-inputs">
          <summary>Use local paths instead</summary>
          <div class="advanced-grid">
            <label>
              ULog path
              <input id="logPath" name="log_path" type="text" placeholder="/path/to/flight.ulg">
            </label>
            <label>
              Mission path
              <input id="missionPath" name="mission_path" type="text" placeholder="optional .plan or .waypoints">
            </label>
            <label>
              Parameters XML path
              <input id="parametersXmlPath" name="parameters_xml_path" type="text" placeholder="optional parameters.xml">
            </label>
          </div>
        </details>

        <div class="upload-actions">
          <button id="uploadButton" type="submit">Upload and Review</button>
        </div>
      </form>

      <div
        class="upload-progress"
        id="uploadProgress"
        role="progressbar"
        aria-label="Uploading flight log"
        aria-valuemin="0"
        aria-valuemax="100"
        hidden
      >
        <div class="upload-progress-bar" id="uploadProgressBar"></div>
      </div>
      <p id="uploadError" class="upload-error" hidden></p>
    </main>
    <script src="/upload.js"></script>
  </body>
</html>
