<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flight Log Analysis</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div>
            <h1>Flight Log</h1>
            <p id="sidebarSummary">No log loaded</p>
          </div>
          <button class="icon-button" id="sidebarToggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">
            <span aria-hidden="true">‹</span>
          </button>
        </div>

        <section class="fact-section">
          <h2>Facts</h2>
          <dl class="fact-grid" id="factGrid"></dl>
        </section>

        <section class="fact-section">
          <div class="section-title-row">
            <h2>Warnings</h2>
            <span class="count-pill" id="warningCount">0</span>
          </div>
          <div class="message-list" id="warningsList"></div>
        </section>

        <section class="fact-section">
          <div class="section-title-row">
            <h2>Parameters</h2>
            <span class="count-pill" id="parameterCount">0</span>
          </div>
          <div class="toolbar">
            <input id="parameterSearch" type="search" placeholder="Search all parameters">
            <select id="parameterStatus">
              <option value="all">All parameters</option>
              <option value="non_default">Non-default</option>
              <option value="default">Default</option>
              <option value="unknown">Unknown default</option>
            </select>
            <label class="check-row">
              <input id="hideRcCal" type="checkbox">
              Hide RC/CAL
            </label>
          </div>
          <div class="table-shell">
            <table class="dense-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Value</th>
                  <th>Default</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="parameterRows"></tbody>
            </table>
          </div>
        </section>

        <section class="fact-section">
          <div class="section-title-row">
            <h2>Topics</h2>
            <span class="count-pill" id="topicCount">0</span>
          </div>
          <div class="toolbar">
            <input id="topicSearch" type="search" placeholder="Search topics and fields">
          </div>
          <div id="topicRows" class="topic-list"></div>
        </section>
      </aside>

      <main class="main-canvas">
        <form class="input-bar upload-form" id="preparseForm" enctype="multipart/form-data">
          <label>
            ULog file
            <input id="logFile" name="log_file" type="file" accept=".ulg">
          </label>
          <label>
            Mission file
            <input id="missionFile" name="mission_file" type="file" accept=".plan,.waypoints,.txt">
          </label>
          <label>
            Parameters XML
            <input id="parametersXmlFile" name="parameters_xml_file" type="file" accept=".xml">
          </label>
          <label>
            PX4 source
            <input id="sourcePath" name="source_path" type="text" placeholder="optional PX4 checkout">
          </label>
          <button type="submit">Pre-parse</button>
          <details class="advanced-inputs">
            <summary>Use local paths instead</summary>
            <div class="advanced-grid">
              <label>
                ULog path
                <input id="logPath" name="log_path" type="text" placeholder="/path/to/flight.ulg">
              </label>
              <label>
                Mission path
                <input id="missionPath" name="mission_path" type="text" placeholder="optional .plan or .waypoints">
              </label>
              <label>
                Parameters XML path
                <input id="parametersXmlPath" name="parameters_xml_path" type="text" placeholder="optional parameters.xml">
              </label>
            </div>
          </details>
        </form>
        <div class="upload-progress" id="uploadProgress" hidden>
          <div class="upload-progress-bar" id="uploadProgressBar"></div>
        </div>

        <section class="canvas-section">
          <div class="section-title-row">
            <h2>Pre-parse Result</h2>
            <span id="runStatus" class="status-text">Idle</span>
          </div>
          <div id="mainSummary" class="summary-panel">
            <p>Load a ULog to inspect deterministic facts before running the analysis agent.</p>
          </div>
        </section>

        <section class="canvas-section">
          <h2>Changed Parameters</h2>
          <div class="table-shell main-table">
            <table class="dense-table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Name</th>
                  <th>Value</th>
                </tr>
              </thead>
              <tbody id="changedParameterRows"></tbody>
            </table>
          </div>
        </section>

        <section class="canvas-section">
          <h2>Timeline</h2>
          <div id="timelineRows" class="timeline-list"></div>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
